[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rig-ai-engineering"
version = "0.2.0"
description = "Scores prompts on a 4-axis rubric and rewrites weak ones, offline and deterministic"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Mike Rodgers", email = "mrodgersjs-web@users.noreply.github.com" },
]
keywords = ["prompt-engineering", "llm", "agent", "cli", "lint"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
rig-ai = "rig_ai.cli:main"

[project.urls]
Homepage = "https://github.com/mrodgersjs-web/rig-ai-engineering"
Repository = "https://github.com/mrodgersjs-web/rig-ai-engineering"
Issues = "https://github.com/mrodgersjs-web/rig-ai-engineering/issues"

[tool.hatch.build.targets.wheel]
packages = ["rig_ai"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.ruff]
# the marker regex tables in prompt_engine.py run long by design
line-length = 220
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
