<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .kicker{font-family:'JetBrains Mono',monospace;font-size:11px;fill:#C8A96E;letter-spacing:3px;text-transform:uppercase}
      .title{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:27px;fill:#F5F0EB}
      .label{font-family:'Hanken Grotesk','Helvetica Neue',sans-serif;font-size:12px;fill:#F5F0EB;letter-spacing:1px}
      .mono{font-family:'JetBrains Mono','SF Mono',monospace;font-size:10.5px;fill:#A09890}
      .mono-gold{font-family:'JetBrains Mono','SF Mono',monospace;font-size:11px;fill:#C8A96E}
      .caption{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#635D57;letter-spacing:2px;text-transform:uppercase}
    </style>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8A96E" stop-opacity="0.4"/><stop offset="100%" stop-color="#C8A96E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#171310" stop-opacity="1"/><stop offset="100%" stop-color="#0A0806" stop-opacity="1"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C8A96E"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="url(#ambient)"/>

  <text x="60" y="42" class="kicker">AI ENGINEERING</text>
  <text x="60" y="72" class="title">Four axes score every prompt</text>

  <!-- radar chart, center at 390,225, 4 axes at N/E/S/W, radius 130 -->
  <g transform="translate(390,225)">
    <!-- grid rings -->
    <polygon points="0,-130 130,0 0,130 -130,0" fill="none" stroke="#A09890" stroke-width="1" opacity="0.18"/>
    <polygon points="0,-97.5 97.5,0 0,97.5 -97.5,0" fill="none" stroke="#A09890" stroke-width="1" opacity="0.14"/>
    <polygon points="0,-65 65,0 0,65 -65,0" fill="none" stroke="#A09890" stroke-width="1" opacity="0.12"/>
    <polygon points="0,-32.5 32.5,0 0,32.5 -32.5,0" fill="none" stroke="#A09890" stroke-width="1" opacity="0.1"/>
    <!-- axis lines -->
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#A09890" stroke-width="1" opacity="0.2"/>
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#A09890" stroke-width="1" opacity="0.2"/>

    <!-- BEFORE polygon (dim stone) : specificity 40, structure 55, grounding 30, actionability 45 (of 130 max) -->
    <polygon points="0,-52 39,0 0,39 -47,0" fill="#A09890" fill-opacity="0.12" stroke="#A09890" stroke-width="1.6"/>

    <!-- AFTER polygon (gold) : specificity 118, structure 112, grounding 100, actionability 122 -->
    <polygon points="0,-118 112,0 0,100 -122,0" fill="#C8A96E" fill-opacity="0.16" stroke="#C8A96E" stroke-width="2.2" filter="none"/>

    <!-- enhancement arrows from before-vertex to after-vertex -->
    <path d="M0,-52 L0,-108" stroke="#C8A96E" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.9"/>
    <path d="M39,0 L104,0" stroke="#C8A96E" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.9"/>
    <path d="M0,39 L0,92" stroke="#C8A96E" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.9"/>
    <path d="M-47,0 L-114,0" stroke="#C8A96E" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.9"/>

    <!-- vertex dots -->
    <circle cx="0" cy="-118" r="4" fill="#C8A96E"/>
    <circle cx="112" cy="0" r="4" fill="#C8A96E"/>
    <circle cx="0" cy="100" r="4" fill="#C8A96E"/>
    <circle cx="-122" cy="0" r="4" fill="#C8A96E"/>

    <!-- axis labels -->
    <text x="0" y="-148" text-anchor="middle" class="label">SPECIFICITY</text>
    <text x="152" y="4" text-anchor="start" class="label">STRUCTURE</text>
    <text x="0" y="158" text-anchor="middle" class="label">GROUNDING</text>
    <text x="-152" y="4" text-anchor="end" class="label">ACTIONABILITY</text>
  </g>

  <!-- legend -->
  <g transform="translate(760,140)">
    <text class="mono-gold" y="0">SCORE BREAKDOWN</text>
    <circle cx="4" cy="26" r="4" fill="#A09890"/>
    <text x="16" y="30" class="mono">baseline prompt · 4.2 / 10</text>
    <circle cx="4" cy="50" r="4" fill="#C8A96E"/>
    <text x="16" y="54" class="mono" fill="#C8A96E">enhanced prompt · 9.1 / 10</text>

    <line x1="0" y1="80" x2="360" y2="80" stroke="#A09890" stroke-width="1" opacity="0.15"/>

    <text y="106" class="mono" fill="#F5F0EB" font-size="11">+ named output schema</text>
    <text y="126" class="mono" fill="#F5F0EB" font-size="11">+ constrained examples</text>
    <text y="146" class="mono" fill="#F5F0EB" font-size="11">+ explicit success criteria</text>
    <text y="166" class="mono" fill="#F5F0EB" font-size="11">+ grounded source citations</text>
  </g>

  <line x1="60" y1="352" x2="1140" y2="352" stroke="#A09890" stroke-width="1" opacity="0.12"/>
  <text x="60" y="374" class="caption">score before you ship, not after it fails</text>
</svg>
